services:
  db:
    image: postgres:17-alpine
    container_name: haven-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: haven
    ports:
      - "5432:5432"
    volumes:
      - haven_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d haven"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local SMTP sink with a web inbox at http://localhost:8025.
  # Emails (verification, password reset) land here in development.
  mailpit:
    image: axllent/mailpit:latest
    container_name: haven-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  haven_pgdata:
